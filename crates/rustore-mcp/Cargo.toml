[package]
name = "rustore-mcp"
description = "MCP server and CLI for the RuStore API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# Маскирование ключа в base64 в выводе команды `key exec`.
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Хеши токенов доступа HTTP-режима и их сравнение за постоянное время.
sha2 = "0.10.9"
subtle = "2.6.1"
# Временный каталог файла ключа `key exec`.
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.2.0"
toml_edit = "0.25.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
zeroize = "1.8.2"
rustore-api = { version = "0.2.0", path = "../rustore-api" }
rustore-mcp-core = { version = "0.2.0", path = "../rustore-mcp-core" }

[target.'cfg(unix)'.dependencies]
# Пересылка SIGTERM и SIGHUP дочерней команде `key exec`.
nix = { version = "0.29.0", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
# Объект задания (Job Object) для дерева процессов команды `key exec`: безопасный API без
# `unsafe` в нашем коде.
win32job = "2.0.3"

[lints]
workspace = true

[dev-dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["client", "server"] }
# Запросы к HTTP-режиму в тестах.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
# Ключ RSA для тестов генерируется в самом тесте.
rustore-api = { version = "0.2.0", path = "../rustore-api", features = ["testing"] }
wiremock = "0.6.5"
